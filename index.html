<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstellar Math - 笛卡尔之心</title>
    <style>
        /* --- 基础设置 --- */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace; /* 科幻代码风格字体 */
            color: #0ff;
        }

        canvas {
            display: block;
        }

        /* --- 全息 UI 面板风格 --- */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
            padding: 15px;
            background: rgba(0, 20, 40, 0.6); /* 深蓝半透明 */
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-left: 4px solid #0ff;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            user-select: none;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px #0ff;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            color: #aaa;
        }

        .data-value {
            color: #0ff;
            font-weight: bold;
        }

        /* 模拟的 FPS 波动条 */
        #fps-bar {
            width: 100%;
            height: 4px;
            background: #333;
            margin-top: 5px;
            position: relative;
            overflow: hidden;
        }
        #fps-fill {
            width: 60px;
            height: 100%;
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
            transition: width 0.2s;
        }

        /* --- 交互按钮 --- */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .sci-fi-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 10px 30px;
            font-family: inherit;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: default; 
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            opacity: 0.8;
            text-align: center;
            min-width: 220px;
        }

        #love-timer {
            font-size: 11px;
            color: #00ffaa;
            margin-top: 4px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* 装饰性角落 */
        .corner {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid #0ff;
            pointer-events: none;
        }
        .tr { top: -2px; right: -2px; border-bottom: none; border-left: none; }
        .bl { bottom: -2px; left: -2px; border-top: none; border-right: none; }

        /* 加载提示 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-size: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <!-- 3D 容器 -->
    <div id="canvas-container"></div>

    <!-- 全息数据面板 -->
    <div id="ui-container">
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <h1>System Status</h1>
        <div class="data-row">
            <span>PARTICLES:</span>
            <span class="data-value">60,000</span>
        </div>
        <div class="data-row">
            <span>GEOMETRY:</span>
            <span class="data-value" id="shape-name">CARTESIAN HEART</span>
        </div>
        <div class="data-row">
            <span>FPS:</span>
            <span class="data-value" id="fps-num">60</span>
        </div>
        <div id="fps-bar"><div id="fps-fill"></div></div>
        <div class="data-row" style="margin-top: 10px; font-size: 10px; color: #555;">
            Coordinates: <span id="coords">0, 0, 0</span>
        </div>
    </div>

    <!-- 控制按钮 (现在是静态指示牌 + 计时器) -->
    <div id="controls">
        <div class="sci-fi-btn">
            <div style="font-size: 16px; margin-bottom: 2px;">HYD❤️ZL</div>
            <div id="love-timer">CALCULATING...</div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
        </div>
    </div>

    <div id="loading">INITIALIZING SYSTEM...</div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 全局变量 ---
        let scene, camera, renderer, particles;
        let geom;
        const particleCount = 60000;
        
        // 计时器起始时间: 2024年8月30日 凌晨 1:30:00
        // 注意: 月份从0开始，所以8月是7
        const startDate = new Date(2014, 8, 30, 1, 30, 0);
        
        // 存储不同形态的顶点位置数据
        const shapes = [];
        
        // 动画与交互
        let mouseX = 0;
        let mouseY = 0;
        
        // --- 1. 初始化系统 ---
        function init() {
            const container = document.getElementById('canvas-container');

            // 场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.001);

            // 相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
            camera.position.z = 800;
            camera.position.y = 100;

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000);
            container.appendChild(renderer.domElement);

            // 纹理
            const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/spark1.png'); 

            // 材质
            const material = new THREE.PointsMaterial({
                size: 3,
                map: sprite,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0.6,
                vertexColors: true
            });

            // --- 2. 生成粒子几何体 ---
            geom = new THREE.BufferGeometry();
            
            // 初始化缓冲区
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const currentPositions = new Float32Array(particleCount * 3);

            // 预先计算所有形状的位置数据 (只保留心形)
            console.log("Generating Heart...");
            shapes.push({ name: "CARTESIAN HEART", data: getHeartPositions(), color: new THREE.Color(0xff3366) });
            
            // 初始状态设为 Heart (shapes数组中唯一的元素)
            const startShape = shapes[0];
            document.getElementById('shape-name').innerText = startShape.name;

            for (let i = 0; i < particleCount; i++) {
                currentPositions[i * 3] = startShape.data[i * 3];
                currentPositions[i * 3 + 1] = startShape.data[i * 3 + 1];
                currentPositions[i * 3 + 2] = startShape.data[i * 3 + 2];

                // 初始颜色设置
                // 检查是否是最后两个高亮粒子
                if (i >= particleCount - 2) {
                    // 设置为超亮的白色/淡粉色，利用 AdditiveBlending 产生强烈辉光
                    colors[i * 3] = 2.0;     // R (超过1.0的值在叠加混合模式下会更亮)
                    colors[i * 3 + 1] = 1.8; // G
                    colors[i * 3 + 2] = 1.8; // B
                } else {
                    // 标准心形颜色，稍微加点随机亮度变化增加层次感
                    const ShadeVar = Math.random() * 0.2;
                    colors[i * 3] = startShape.color.r + ShadeVar;
                    colors[i * 3 + 1] = startShape.color.g + ShadeVar * 0.5;
                    colors[i * 3 + 2] = startShape.color.b + ShadeVar * 0.5;
                }
            }

            geom.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            // 保存目标位置属性
            geom.userData = {
                currentPositions: currentPositions, 
                targetPositions: Float32Array.from(startShape.data),
                currentColor: startShape.color,
                targetColor: startShape.color
            };

            particles = new THREE.Points(geom, material);
            scene.add(particles);

            // --- 事件监听 ---
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);
            
            // 隐藏加载文字
            document.getElementById('loading').style.display = 'none';

            animate();
        }

        // --- 3. 数学图形生成算法 ---

        // 仅保留：笛卡尔心形 (Heart Surface) 并添加高亮点
        function getHeartPositions() {
            const arr = new Float32Array(particleCount * 3);
            const scale = 25;

            // 1. 生成主体心形粒子 (保留最后两个位置给高亮点)
            for (let i = 0; i < particleCount - 2; i++) {
                // 参数范围
                let t = Math.random() * Math.PI * 2;
                let u = Math.random() * Math.PI; 

                // 3D心形参数方程
                const x = 16 * Math.pow(Math.sin(t), 3) * Math.sin(u);
                const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                const z = 16 * Math.pow(Math.sin(t), 3) * Math.cos(u);

                arr[i * 3] = x * scale;
                arr[i * 3 + 1] = y * scale;
                arr[i * 3 + 2] = z * scale;
            }

            // 2. 添加两个高亮点在对称轴两边 (心形的两侧顶点)
            // 右侧高亮点 (particleCount - 2)
            let i = particleCount - 2;
            arr[i * 3] = 16 * scale;      // X轴正向极值
            arr[i * 3 + 1] = 4 * scale;   // Y轴稍微向上偏移，视觉效果更好
            arr[i * 3 + 2] = 0;           // Z轴中心

            // 左侧高亮点 (particleCount - 1)
            i = particleCount - 1;
            arr[i * 3] = -16 * scale;     // X轴负向极值
            arr[i * 3 + 1] = 4 * scale;   // Y轴对称
            arr[i * 3 + 2] = 0;           // Z轴中心

            return arr;
        }

        // --- 4. 动画与控制逻辑 ---

        function updateLoveTimer() {
            const now = new Date();
            const diff = now - startDate; // 毫秒差

            if (diff < 0) {
                document.getElementById('love-timer').innerText = "T-MINUS...";
                return;
            }

            // 计算时间单位
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // 格式化补零
            const h = hours.toString().padStart(2, '0');
            const m = minutes.toString().padStart(2, '0');
            const s = seconds.toString().padStart(2, '0');

            // 更新显示
            const timerText = `${days} DAYS ${h}:${m}:${s}`;
            document.getElementById('love-timer').innerText = timerText;
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.5;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.5;
            
            // 更新UI上的坐标显示
            document.getElementById('coords').innerText = 
                `${Math.round(mouseX)}, ${Math.round(mouseY)}`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // FPS 模拟逻辑
        let frameCount = 0;
        let lastTime = performance.now();
        function updateFPS() {
            frameCount++;
            const time = performance.now();
            if (time - lastTime >= 1000) {
                const fps = frameCount;
                document.getElementById('fps-num').innerText = fps;
                
                const fill = document.getElementById('fps-fill');
                const width = Math.min(100, (fps / 60) * 100);
                fill.style.width = width + '%';
                fill.style.backgroundColor = fps > 50 ? '#0f0' : (fps > 30 ? '#ff0' : '#f00');
                fill.style.boxShadow = `0 0 10px ${fill.style.backgroundColor}`;

                frameCount = 0;
                lastTime = time;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateFPS();
            updateLoveTimer(); // 每帧更新计时器

            // 待机动画 (Idling)
            // 缓慢旋转心形
            particles.rotation.y += 0.003; 

            // 让粒子轻微波动，模拟“心跳”或能量流动的感觉
            const time = Date.now() * 0.001;
            const positions = geom.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                // 简单的正弦波扰动，幅度很小
                positions[i*3] += Math.sin(time + i*0.1) * 0.1;
                positions[i*3+1] += Math.cos(time + i*0.1) * 0.1;
            }
            geom.attributes.position.needsUpdate = true;
            
            // 鼠标交互带来的轻微倾斜
            particles.rotation.x += (mouseY * 0.0005 - particles.rotation.x) * 0.05;
            particles.rotation.z += (mouseX * 0.0005 - particles.rotation.z) * 0.05;

            renderer.render(scene, camera);
        }

        // 启动
        init();

    </script>
</body>
</html>
