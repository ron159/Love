<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Interstellar Math - 笛卡尔之心，一个浪漫的 3D 粒子心形动画">
    <meta name="theme-color" content="#000000">
    <title>Interstellar Math - 笛卡尔之心</title>

    <!-- 外部样式表 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 3D 容器 -->
    <div id="canvas-container"></div>

    <!-- 全息数据面板 -->
    <div id="ui-container">
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <h1>System Status</h1>
        <div class="data-row">
            <span>PARTICLES:</span>
            <span class="data-value">60,000</span>
        </div>
        <div class="data-row">
            <span>GEOMETRY:</span>
            <span class="data-value" id="shape-name">RON'S HEART</span>
        </div>
        <div class="data-row">
            <span>FPS:</span>
            <span class="data-value" id="fps-num">60</span>
        </div>
        <div id="fps-bar">
            <div id="fps-fill"></div>
        </div>
        <div class="data-row" style="margin-top: 10px; font-size: 10px; color: #555;">
            Coordinates: <span id="coords">0, 0</span>
        </div>
    </div>

    <!-- 功能按钮组 -->
    <div id="feature-buttons">
        <!-- 切换 UI 按钮 (移动端) -->
        <button id="toggle-ui" class="feature-btn" onclick="toggleUI()" aria-label="Toggle UI">
            📊
        </button>

        <!-- 音乐按钮 -->
        <button id="music-btn" class="feature-btn" onclick="toggleMusic()" aria-label="Toggle Music">
            <div class="music-waves paused">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>

        <!-- 分享/截图按钮 -->
        <button id="share-btn" class="feature-btn" onclick="shareImage()" aria-label="Share">
            📷
        </button>
    </div>

    <!-- 心跳指示器 -->
    <div id="heartbeat-indicator">
        <span class="pulse">♥</span> HEARTBEAT ACTIVE
    </div>

    <!-- 控制面板 (爱情计时器) -->
    <div id="controls">
        <div class="sci-fi-btn">
            <div style="font-size: 16px; margin-bottom: 2px;">HYD❤️ZL</div>
            <div id="love-timer">CALCULATING...</div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
        </div>
    </div>

    <!-- 纪念日弹窗 -->
    <div id="anniversary-alert">
        <button class="close-btn" onclick="hideAnniversaryAlert()">×</button>
        <h2>🎉 纪念日快乐！</h2>
        <p id="anniversary-message"></p>
    </div>

    <!-- 加载提示 -->
    <div id="loading">INITIALIZING SYSTEM...</div>

    <!-- Three.js 库 (UMD 格式) -->
    <script src="assets/three.min.js"></script>

    <!-- 主脚本 -->
    <script src="main.js"></script>

</body>

</html>
